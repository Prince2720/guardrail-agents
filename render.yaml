# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets (sync: false) are typed into the Render dashboard, never stored in git.
services:
  - type: web
    name: guardrail-agents
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: DEMO_DAILY_REQUESTS
        value: "300"
      - key: DEMO_DAILY_TOKENS
        value: "100000"
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
